<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Object Map — D3 SVG</title>
<!--
  Graph Gallery · d3-object-map  (group 3 "object views": every node is drawn as the object itself)
  Library: D3 7.9.0 (d3-force + d3-zoom + d3-drag + d3-polygon), hand-built SVG frames + <image> tiles in ./main.js.
  CDN URLs used (pinned):
    https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js
  Data: ../../shared/system.json · Assets: ../../shared/assets/ · Chrome: ../../shared/hud.js + theme.css
-->
<link rel="stylesheet" href="../../shared/theme.css">
<style>
  #map { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #map:active { cursor: grabbing; }
  .node { cursor: pointer; }
  .node .body { transition: transform .18s ease-out; }
  .node.hover .body { transform: scale(1.35); }
  .node.hover .frame { filter: drop-shadow(0 0 6px var(--c)); }
  .node.dim { opacity: .2; }
  .node .frame { fill: var(--c); fill-opacity: .14; stroke: var(--c); stroke-width: 1.5; }
  .node .well { fill: rgba(255,255,255,.06); }
  .node text { fill: var(--fg); font-size: 11px; text-anchor: middle; pointer-events: none; }
  .node text.tech { fill: var(--muted); font-size: 9.5px; }
  .node text.label { font-weight: 500; }
  .node text.sub { fill: var(--muted); font-size: 10px; }
  .zoomed-out .node:not(.service):not(.repo):not(.document) text.sub { display: none; }
  .node text.badge { font-family: var(--mono); font-size: 9px; fill: var(--c); text-anchor: end; font-weight: 600; }
  .node text.count { font-family: var(--mono); font-size: 9px; fill: #07080f; font-weight: 700; }
  .link { transition: opacity .15s; }
  .link.dim { opacity: .15; }
  .link.lit { filter: drop-shadow(0 0 3px currentColor); }
  .edge-label { font-size: 9px; fill: var(--muted); text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: #07080f; stroke-width: 3px; }
  .hull { fill-opacity: .09; stroke-opacity: .35; stroke-width: 1; stroke-dasharray: 4 4; pointer-events: none; }
  .hull-label { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; fill-opacity: .75; pointer-events: none; }
  .legend.objects { display: grid; gap: 3px; font-size: 12px; max-height: 60vh; }
  .legend.objects .legend-row { gap: 6px; }
  .legend.objects svg { flex: none; }
  .legend.objects .rel { text-transform: none; color: var(--muted); }
  .legend.objects .rel svg { width: 34px; height: 8px; overflow: visible; }
  .legend.objects h4 { margin: 4px 0 2px; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .tooltip.card { max-width: 300px; display: flex; gap: 10px; align-items: flex-start; }
  .tooltip.card img { width: 44px; height: 44px; object-fit: contain; border-radius: 8px; background: rgba(255,255,255,.06); padding: 4px; flex: none; }
  .tooltip.card img.page { width: 54px; height: 72px; object-fit: cover; padding: 0; border-radius: 3px; }
  .tooltip.card .tt-type { color: var(--muted); font-size: 11px; text-transform: capitalize; margin-bottom: 4px; }
  #preview { position: fixed; z-index: 25; right: 16px; bottom: 16px; width: 360px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); display: none; }
  #preview.show { display: block; }
  #preview img { width: 100%; border-radius: 4px; display: block; }
  #preview h3 { margin: 0 0 6px; font-size: 13px; display: flex; justify-content: space-between; }
  #preview h3 button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; }
  #preview .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  #preview .chip { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .hud-hidden #preview { display: none !important; }
</style>
</head>
<body>
<svg id="map"></svg>
<div id="preview"></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
