<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Symbols — ECharts</title>
<!--
  Graph Gallery · echarts-image-symbols  (group 3 "object views": every node is its object)
  Library: ECharts 6.1.0, series.type 'graph' (force / circular), every node an 'image://' symbol composed offscreen
  (frame + icon + logo + badges) from the shared PNG/SVG assets; document thumbnails as rectangular symbols.
  CDN URLs used (pinned):
    https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js
  Data: ../../shared/system.json · Assets: ../../shared/assets/ · Chrome: ../../shared/hud.js + theme.css
-->
<link rel="stylesheet" href="../../shared/theme.css">
<style>
  #hulls { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; }
  #chart { position: fixed; inset: 0; z-index: 1; }
  .hull { fill-opacity: .09; stroke-opacity: .35; stroke-width: 1; stroke-dasharray: 4 4; }
  .hull-label { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; fill-opacity: .75; font-family: var(--font); }
  .legend.objects { display: grid; gap: 3px; font-size: 12px; }
  .legend.objects h4 { margin: 2px 0; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .legend.objects .legend-row { text-transform: none; color: var(--muted); gap: 6px; }
  .legend.objects .legend-row img { width: 34px; height: 24px; object-fit: contain; }
  .legend.objects .rel svg { width: 34px; height: 8px; overflow: visible; }
  .tooltip.card { max-width: 300px; display: flex; gap: 10px; align-items: flex-start; }
  .tooltip.card img { width: 44px; height: 44px; object-fit: contain; border-radius: 8px; background: rgba(255,255,255,.06); padding: 4px; flex: none; }
  .tooltip.card img.page { width: 54px; height: 72px; object-fit: cover; padding: 0; border-radius: 3px; }
  .tooltip.card .tt-type { color: var(--muted); font-size: 11px; text-transform: capitalize; margin-bottom: 4px; }
  #preview { position: fixed; z-index: 25; right: 16px; bottom: 60px; width: 360px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); display: none; }
  #preview.show { display: block; }
  #preview img { width: 100%; border-radius: 4px; display: block; }
  #preview h3 { margin: 0 0 6px; font-size: 13px; display: flex; justify-content: space-between; }
  #preview h3 button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; }
  #preview .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  #preview .chip { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .hud-hidden #preview { display: none !important; }
</style>
</head>
<body>
<svg id="hulls"></svg>
<div id="chart"></div>
<div id="preview"></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
