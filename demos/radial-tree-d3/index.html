<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radial Tree — D3 tidy tree with department sectors</title>
<!--
  Graph Gallery · radial-tree-d3 (structured group)
  Library: D3 7.9.0 (d3-hierarchy tree, d3-shape linkRadial/symbol, d3-zoom, d3-transition), SVG renderer in ./main.js.
  CDN URLs used (pinned):
    https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js
  Data: ../../shared/org.json via loadOrg() · Chrome: ../../shared/hud.js (+ theme.css)
  Layout: each department owns an angular sector (proportional to visible leaves) separated by gap wedges;
  d3.tree() runs per department inside its sector, so branches never interleave.
-->
<link rel="stylesheet" href="../../shared/theme.css">
<style>
  #c { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; display: block; cursor: grab; }
  #c:active { cursor: grabbing; }
  .sector { fill-opacity: .045; stroke-opacity: .10; stroke-width: 1; transition: fill-opacity .3s; }
  .link { fill: none; stroke-linecap: round; transition: opacity .25s; }
  .node { cursor: default; transition: opacity .25s; }
  .node.branch { cursor: pointer; }
  .node .halo { pointer-events: none; }
  .node .glyph { stroke-width: 1.2; }
  .node.status-pilot .glyph { fill-opacity: .35; stroke-dasharray: 2 2; }
  .node.status-idea .glyph { fill-opacity: 0; stroke-opacity: .7; }
  .node .ring { fill: none; stroke-width: 1.6; stroke-opacity: .75; pointer-events: none; }
  .node.collapsed .glyph { stroke: #fff; stroke-width: 2; }
  .label { fill: #e8eaf2; font-size: 10.5px; paint-order: stroke; stroke: #07080f; stroke-width: 3px; pointer-events: none; }
  .label.project { font-size: 11px; font-weight: 500; }
  .label.leaf { opacity: 0; transition: opacity .25s; fill: rgba(232,234,242,.85); }
  #c.zoomed .label.leaf, .node.on .label.leaf { opacity: 1; }
  .arc-label { font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; fill-opacity: .9; pointer-events: none; }
  #c.no-labels .label, #c.no-labels .arc-label { display: none; }
  #c.no-rings .ring { display: none; }
  #c.hovering .node:not(.on), #c.hovering .link:not(.on) { opacity: .22; }
  #c.hovering .link.on { stroke-opacity: 1; }
</style>
</head>
<body>
<svg id="c"></svg>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
