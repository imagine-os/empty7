<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation — 3d-force-graph</title>
<!--
  Graph Gallery · force3d-bloom · 3d-force-graph 1.80.0 (Recipe A: UMD graph + ESM bloom pass, as in the
  official bloom-effect example). CDN URLs used (all pinned; verify once from a normal machine):
    https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.0/dist/3d-force-graph.min.js      (UMD, bundles three r183)
    https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js                   (import map "three")
    https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/                           (import map "three/addons/")
      -> three/addons/postprocessing/UnrealBloomPass.js (+ its relative imports Pass.js, shaders/*.js)
    https://cdn.jsdelivr.net/npm/three-spritetext@1.10.0/dist/three-spritetext.mjs     (import map "three-spritetext")
  Data: ../../shared/data.json · chrome: ../../shared/hud.js + theme.css
-->
<link rel="stylesheet" href="../../shared/theme.css">
<style>
  body { background: #000004; }
  #graph { position: fixed; inset: 0; opacity: 0; transition: opacity 1.8s ease-out; }
  #graph.in { opacity: 1; }
  .scene-nav-info { display: none !important; }
</style>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.0/dist/3d-force-graph.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
  "three-spritetext": "https://cdn.jsdelivr.net/npm/three-spritetext@1.10.0/dist/three-spritetext.mjs"
} }
</script>
</head>
<body>
<div id="graph"></div>
<script type="module">
import { Vector2, Vector3 } from 'three';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import SpriteText from 'three-spritetext';
import { loadData, mountHud, linkColor, tooltipHtml, GOLD } from '../../shared/hud.js';

const el = document.getElementById('graph');
const data = await loadData('../../shared/data.json');
const { byId, neighbors } = data;

// Orient edges so awards flow *to* winners (particles run source -> target) and so the graph is a DAG
// rooted at studios + awards for the radial mode: studio->film, award->film|person, person->film, film->genre.
const flip = new Set(['produced_by', 'nominated', 'won', 'nominee']);
const links = data.links.map(l => flip.has(l.relation) ? { ...l, source: l.target, target: l.source } : { ...l });
const isGold = l => linkColor(l) === GOLD;
const idOf = x => typeof x === 'object' ? x.id : x;

// Size: radius ∝ shared n.size, films boosted by gross, people by wins (nodeVal is a volume -> cube it).
const boost = n => n.type === 'film' ? 1 + (n.gross_musd || 0) / 900 : n.type === 'person' ? 1 + (n.wins || 0) * 0.12 : 1;
const radius = n => n.size * 0.75 * boost(n);

// ---- interaction state ------------------------------------------------------------------------
let hoverNode = null, mouse = { x: 0, y: 0 }, fitOnStop = true;
const lit = id => !hoverNode || id === hoverNode.id || neighbors.get(hoverNode.id)?.has(id);
const withAlpha = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;
const toRgba = (c, a) => c.startsWith('#') ? withAlpha(c, a) : c.replace(/[\d.]+\)$/, m => (parseFloat(m) * a) + ')');

const kvFor = n => ({
  film:   { year: n.year, gross: n.gross_musd != null ? `$${n.gross_musd}M` : null, budget: n.budget_musd != null ? `$${n.budget_musd}M` : null, wins: n.wins },
  person: { born: n.born, nationality: n.nationality, films: n.film_count, wins: n.wins },
  studio: { founded: n.founded, country: n.country },
  genre:  { films: n.degree },
  award:  { category: n.category, links: n.degree },
}[n.type] || {});

// ---- graph -------------------------------------------------------------------------------------
const Graph = new ForceGraph3D(el, { controlType: 'orbit' })
  .backgroundColor('#000004')
  .showNavInfo(false)
  .graphData({ nodes: data.nodes, links })
  .nodeRelSize(1)
  .nodeVal(n => Math.pow(radius(n), 3))
  .nodeResolution(24)
  .nodeOpacity(0.95)
  .nodeColor(n => lit(n.id) ? n.color : withAlpha(n.color, 0.12))
  .nodeLabel(() => null)
  .nodeThreeObjectExtend(true)
  .nodeThreeObject(n => {
    if (n.type !== 'studio' && n.type !== 'award' && n !== hoverNode) return undefined;
    const s = new SpriteText(n.label, n.type === 'studio' ? 7 : n.type === 'award' ? 5.5 : 5, n.type === 'award' ? '#f3e6ff' : n.type === 'studio' ? '#ffe3a6' : '#ffffff');
    s.fontFace = 'Inter, Segoe UI, Helvetica, Arial, sans-serif';
    s.fontWeight = n.type === 'studio' ? '600' : '400';
    s.material.depthWrite = false;
    s.position.y = radius(n) + 6;
    return s;
  })
  .linkColor(l => {
    const c = linkColor(l), on = lit(idOf(l.source)) && lit(idOf(l.target));
    return hoverNode ? (on ? toRgba(c, 1) : toRgba(c, 0.08)) : c;
  })
  .linkOpacity(0.25)
  .linkCurvature(0.25)
  .linkWidth(l => isGold(l) ? 0.5 : 0)
  .linkResolution(8)
  .linkDirectionalParticles(l => isGold(l) ? 2 : l.relation === 'nominee' ? 1 : 0)
  .linkDirectionalParticleWidth(l => isGold(l) ? 1.5 : 1)
  .linkDirectionalParticleSpeed(l => isGold(l) ? 0.006 : 0.004)
  .linkDirectionalParticleColor(l => isGold(l) ? GOLD : '#e6c3ff')
  .linkDirectionalParticleResolution(6)
  .d3AlphaDecay(0.02)
  .d3VelocityDecay(0.3)
  .cooldownTicks(200)
  .warmupTicks(60)
  .onEngineStop(() => { if (fitOnStop) { fitOnStop = false; resetView(1200); } })
  .onNodeHover(n => {
    hoverNode = n || null;
    el.style.cursor = n ? 'pointer' : null;
    Graph.nodeColor(Graph.nodeColor()).linkColor(Graph.linkColor()).nodeThreeObject(Graph.nodeThreeObject());
    if (n) hud.showTooltip(tooltipHtml(n.label, { type: n.type, ...kvFor(n) }), mouse.x, mouse.y); else hud.hideTooltip();
  })
  .onNodeClick(focusNode)
  .onNodeDragEnd(n => { n.fx = n.x; n.fy = n.y; n.fz = n.z; });

Graph.d3Force('link').distance(l => ({ produced_by: 60, genre: 50, won: 75, nominated: 65, nominee: 65 }[l.relation] || 32));
Graph.d3Force('charge').strength(-130);

// ---- bloom -------------------------------------------------------------------------------------
const bloom = new UnrealBloomPass(new Vector2(innerWidth, innerHeight), 1.25, 0.7, 0.12);
Graph.postProcessingComposer().addPass(bloom);

// ---- camera ------------------------------------------------------------------------------------
const controls = Graph.controls();
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.autoRotate = true; controls.autoRotateSpeed = 0.5;

function focusNode(n) {
  const d = Math.hypot(n.x, n.y, n.z), dist = 70;
  const ratio = d > 1 ? 1 + dist / d : 0;
  const pos = d > 1 ? { x: n.x * ratio, y: n.y * ratio, z: n.z * ratio } : { x: n.x, y: n.y, z: n.z + dist };
  Graph.cameraPosition(pos, { x: n.x, y: n.y, z: n.z }, 1200);
}
// Fit all nodes in the frustum along the current view direction (built-in zoomToFit aims at the origin, ~2x loose).
function resetView(ms = 1000) {
  const ns = data.nodes, c = new Vector3(); ns.forEach(n => c.add(new Vector3(n.x, n.y, n.z))); c.divideScalar(ns.length);
  const cam = Graph.camera(), p = Graph.cameraPosition(), look = p.lookAt;
  const dir = new Vector3(p.x - look.x, p.y - look.y, p.z - look.z).normalize();
  const right = new Vector3().crossVectors(new Vector3(0, 1, 0), dir).normalize(); if (right.lengthSq() < 1e-6) right.set(1, 0, 0);
  const up = new Vector3().crossVectors(dir, right), v = new Vector3();
  const tanV = Math.tan(cam.fov * Math.PI / 360), tanH = tanV * cam.aspect; let dist = 0;
  ns.forEach(n => { v.set(n.x, n.y, n.z).sub(c); const d = v.dot(dir), m = radius(n) * 1.5; dist = Math.max(dist, (Math.abs(v.dot(up)) + m) / tanV + d, (Math.abs(v.dot(right)) + m) / tanH + d); });
  const pos = c.clone().addScaledVector(dir, dist * 1.06);
  Graph.cameraPosition({ x: pos.x, y: pos.y, z: pos.z }, { x: c.x, y: c.y, z: c.z }, ms);
}

addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
// 3d-force-graph re-dispatches a synthetic touch 'pointerup' on drag end; OrbitControls (r183) trips on it
// (TypeError reading 'x'). The real pointerup still bubbles to the controls, so drop the synthetic one.
document.addEventListener('pointerup', e => { if (!e.isTrusted && e.pointerType === 'touch') e.stopImmediatePropagation(); }, true);
el.addEventListener('pointerdown', () => { controls.autoRotate = false; hud.setToggle('spin', false); hud.spin = false; });
el.addEventListener('dblclick', () => { if (!hoverNode) resetView(); });
addEventListener('resize', () => { Graph.width(innerWidth).height(innerHeight); bloom.setSize(innerWidth, innerHeight); });

// ---- HUD ---------------------------------------------------------------------------------------
const hud = mountHud({
  title: 'Constellation', library: '3d-force-graph', version: '1.80.0', typeColors: data.meta.type_colors,
  toggles: [
    { id: 'bloom', label: 'Bloom', on: true, onChange: on => { bloom.enabled = on; } },
    { id: 'particles', label: 'Award particles', on: true,
      onChange: on => Graph.linkDirectionalParticles(l => !on ? 0 : isGold(l) ? 2 : l.relation === 'nominee' ? 1 : 0) },
    { id: 'dag', label: 'Radial DAG', on: false,
      onChange: on => { fitOnStop = true; Graph.dagMode(on ? 'radialout' : null).dagLevelDistance(on ? 55 : null); } },
    { id: 'spin', label: 'Auto-orbit', on: true, onChange: on => { hud.spin = on; controls.autoRotate = on; } },
  ],
});
hud.spin = true;

// ---- entrance: fade in while the layout settles, camera glides in from deep space ---------------
Graph.cameraPosition({ x: 0, y: 0, z: 1400 });
requestAnimationFrame(() => { el.classList.add('in'); Graph.cameraPosition({ x: 0, y: 120, z: 520 }, { x: 0, y: 0, z: 0 }, 2400); });

// Debug hooks for the gallery's automated smoke test.
window.__demo = {
  graph: Graph, data, hud, bloom,
  get hoverNode() { return hoverNode; },
  screenPos: id => { const n = byId.get(id); return Graph.graph2ScreenCoords(n.x, n.y, n.z); },
  focus: id => focusNode(byId.get(id)), reset: resetView, cameraPos: () => Graph.cameraPosition(),
  settle: () => { fitOnStop = true; Graph.warmupTicks(300).cooldownTicks(0).graphData(Graph.graphData()); }, // sync-settle for thumbnails
};
</script>
</body>
</html>
