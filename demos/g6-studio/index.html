<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G6 Studio</title>
<!--
  Graph Gallery demo: AntV G6 v5 — "Product-grade" dark theme.
  CDN URLs used (pinned, verify on a normal machine):
    https://unpkg.com/@antv/g6@5.1.1/dist/g6.min.js                                (UMD -> window.G6)
    https://unpkg.com/@antv/g6-extension-3d@0.1.23/dist/g6-extension-3d.min.js      (UMD -> window.G6Extension3D, lazy-loaded by the 3D toggle)
  Data: ../../shared/data.json   Chrome: ../../shared/hud.js + theme.css
-->
<link rel="stylesheet" href="../../shared/theme.css">
<style>
  :root { --bg: #0f1117; }
  body { background: radial-gradient(ellipse at 50% 40%, #171a24 0%, #0f1117 55%, #0a0b10 100%); }
  #app, #app3d { position: fixed; inset: 0; }
  #app3d[hidden] { display: none; }
  #app canvas { cursor: default; }
  #minimap { position: fixed; right: 16px; bottom: 56px; width: 180px; height: 110px; padding: 0; overflow: hidden; }
  #minimap canvas { display: block; }
  .hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); letter-spacing: .02em; }
  .fade-in { animation: fade 1.4s ease-out both; } @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
</style>
<script src="https://unpkg.com/@antv/g6@5.1.1/dist/g6.min.js"></script>
</head>
<body>
<div id="app" class="fade-in"></div>
<div id="app3d" hidden></div>
<div id="minimap" class="hud"></div>
<div class="hint hud">drag · wheel · hover · click to focus · double-click empty to reset · shift-drag to brush</div>
<script type="module">
import { loadData, linkColor, mountHud, tooltipHtml, GOLD, TYPE_COLORS } from '../../shared/hud.js';

const { Graph, register, ExtensionCategory } = window.G6;
const URL_3D = 'https://unpkg.com/@antv/g6-extension-3d@0.1.23/dist/g6-extension-3d.min.js';
const d = await loadData();

// ---- shared semantics -------------------------------------------------------------------------
const diameter = n => {
  let r = 3 + Math.sqrt(n.degree) * 2;
  if (n.type === 'film' && n.gross_musd) r += Math.sqrt(n.gross_musd) * 0.2;
  if (n.type === 'person' && n.wins) r += n.wins * 1.2;
  return r * 2;
};
const isFaint = r => r === 'genre' || r === 'produced_by';
const isGold = l => l.relation === 'won' || (l.relation === 'nominee' && l.won);
const DIST = { produced_by: 70, genre: 95, won: 80, nominated: 85, nominee: 90, director: 55, actor: 60, writer: 60, composer: 60, producer: 60 };
const ICON = { studio: '▶', award: '★' };
const isHub = n => n.type === 'studio' || n.type === 'award' || n.degree >= 9;
const tint = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;

const data = {
  nodes: d.nodes.map(n => ({ id: n.id, data: n })),
  edges: d.links.map((l, i) => ({ id: 'e' + i, source: l.source, target: l.target, data: l })),
};
const edgeData = new Map(data.edges.map(e => [e.id, e.data]));
const N = n => n.data ?? d.byId.get(n.id);                 // layout callbacks receive bare {id} nodes
const E = e => e.data ?? edgeData.get(e.id) ?? {};
const studios = d.nodes.filter(n => n.type === 'studio');
const filmsOf = s => d.links.filter(l => l.relation === 'produced_by' && l.target === s.id).map(l => l.source);
const bubblePlugins = () => studios.map(s => ({
  type: 'bubble-sets', key: 'bubble-' + s.id, members: [s.id, ...filmsOf(s)],
  fill: TYPE_COLORS.studio, fillOpacity: 0.055, stroke: TYPE_COLORS.studio, strokeOpacity: 0.3, lineWidth: 1,
  label: true, labelText: s.label.toUpperCase(), labelFill: TYPE_COLORS.studio, labelOpacity: 0.55, labelFontSize: 10,
  labelFontWeight: 600, labelLetterSpacing: 1.5, labelPlacement: 'top', labelOffsetY: -6,
}));
const minimapPlugin = { type: 'minimap', key: 'minimap', container: document.getElementById('minimap'), size: [180, 110], maskStyle: { border: '1px solid rgba(255,255,255,.25)', background: 'rgba(255,255,255,.06)' } };
const bundlingPlugin = { type: 'edge-bundling', key: 'bundling', bundleThreshold: 0.55, K: 0.1, cycles: 6 };
const fisheyePlugin = { type: 'fisheye', key: 'fisheye', trigger: 'pointermove', r: 140, d: 1.6, showDPercent: false,
  style: { fill: 'rgba(255,255,255,0.03)', stroke: 'rgba(255,255,255,0.35)', lineWidth: 1, lineDash: [4, 4] },
  nodeStyle: { labelFontSize: 12, label: true } };
const forceLayout = { type: 'd3-force', link: { distance: e => DIST[E(e).relation] || 70, strength: e => isFaint(E(e).relation) ? 0.25 : 0.7 },
  manyBody: { strength: -60 }, collide: { radius: n => diameter(N(n)) / 2 + 8, strength: 0.8 }, center: { strength: 0.05 }, alphaDecay: 0.04, iterations: 110 };
const radialLayout = (focus) => ({ type: 'radial', focusNode: focus, unitRadius: 110, linkDistance: 70, preventOverlap: true, nodeSize: 34, strictRadial: true });

// ---- 2D graph ---------------------------------------------------------------------------------
const graph = new Graph({
  container: 'app', autoResize: true, theme: 'dark', background: 'transparent', animation: { duration: 800 },
  data,
  node: {
    type: 'circle',
    style: {
      size: n => diameter(n.data),
      fill: n => TYPE_COLORS[n.data.type], fillOpacity: 0.95,
      stroke: n => tint('#ffffff', 0.35), lineWidth: 1.5,
      halo: false, haloStroke: n => TYPE_COLORS[n.data.type], haloLineWidth: 14, haloStrokeOpacity: 0.22,
      labelText: n => isHub(n.data) ? n.data.label : '', labelFill: '#e8eaf2', labelFontSize: 11, labelFontWeight: 500,
      labelPlacement: 'bottom', labelOffsetY: 4, labelBackground: true, labelBackgroundFill: 'rgba(15,17,23,0.72)',
      labelBackgroundRadius: 4, labelPadding: [1, 5], labelMaxWidth: 160,
      iconText: n => ICON[n.data.type] || '', iconFill: '#0f1117', iconFontSize: n => Math.max(8, diameter(n.data) * 0.42),
      badge: true,
      badges: n => (n.data.type === 'film' && n.data.wins) ? [{ text: String(n.data.wins), placement: 'right-top', backgroundFill: GOLD, fill: '#1b1500', fontSize: 8, fontWeight: 700, padding: [0, 3] }] : [],
    },
    state: {
      active: { halo: true, lineWidth: 2, stroke: '#ffffff', label: true, labelText: n => n.data.label, zIndex: 3 },
      selected: { halo: true, lineWidth: 2.5, stroke: '#ffffff', label: true, labelText: n => n.data.label, zIndex: 4 },
      inactive: { fillOpacity: 0.12, strokeOpacity: 0.1, iconOpacity: 0.15, labelOpacity: 0.08, badgeBackgroundOpacity: 0.1 },
    },
    animation: { enter: [{ fields: ['opacity'], duration: 900 }, { fields: ['size'], shape: 'key', duration: 900 }] },
  },
  edge: {
    type: e => isFaint(e.data.relation) ? 'line' : 'cubic',
    style: {
      stroke: e => linkColor(e.data), strokeOpacity: e => isFaint(e.data.relation) ? 1 : (isGold(e.data) ? 0.85 : 0.45),
      lineWidth: e => isGold(e.data) ? 2 : 1, lineDash: e => e.data.relation === 'genre' ? [3, 5] : 0,
      endArrow: e => e.data.relation === 'won', endArrowSize: 9, endArrowFill: GOLD, curveOffset: 24,
      shadowColor: e => isGold(e.data) ? GOLD : 'transparent', shadowBlur: e => isGold(e.data) ? 8 : 0,
    },
    state: { active: { lineWidth: 2.2, strokeOpacity: 1, zIndex: 2 }, inactive: { strokeOpacity: 0.05, shadowBlur: 0 } },
    animation: { enter: [{ fields: ['opacity'], duration: 1200, delay: 300 }] },
  },
  layout: forceLayout,
  behaviors: [
    'drag-canvas', { type: 'zoom-canvas', sensitivity: 1.1 }, 'drag-element',
    { type: 'hover-activate', key: 'hover', degree: 1, state: 'active', inactiveState: 'inactive', animation: false },
    { type: 'click-select', key: 'select', degree: 1, state: 'selected', neighborState: 'active', unselectedState: 'inactive' },
    { type: 'brush-select', key: 'brush', trigger: 'shift', immediately: true, style: { fill: 'rgba(255,255,255,0.05)', stroke: 'rgba(255,255,255,0.4)', lineWidth: 1 } },
  ],
  plugins: [minimapPlugin],           // bubble sets are added once the layout has settled (they re-march on every tick)
});

// ---- HUD ----------------------------------------------------------------------------------------
const state = { bundling: false, fisheye: false, radial: false, three: false };
let graph3d = null, focusStudio = studios[0].id;
const plugins = () => [...(state.radial ? [] : bubblePlugins()), minimapPlugin, ...(state.bundling ? [bundlingPlugin] : []), ...(state.fisheye ? [fisheyePlugin] : [])];

const hud = mountHud({
  title: 'G6 Studio', library: 'AntV G6', version: '5.1.1', typeColors: d.meta.type_colors,
  toggles: [
    { id: 'bundling', label: 'Edge bundling', on: false, onChange: async on => { state.bundling = on; graph.setPlugins(plugins()); await graph.draw(); } },
    { id: 'fisheye', label: 'Fisheye', on: false, onChange: on => { state.fisheye = on; graph.setPlugins(plugins()); } },
    { id: 'radial', label: 'Radial layout', on: false, onChange: async on => { state.radial = on; graph.setPlugins(plugins()); await graph.layout(on ? radialLayout(focusStudio) : forceLayout); if (!on) graph.setLayout(forceLayout); } },
    { id: 'three', label: '3D mode', on: false, onChange: on => toggle3D(on) },
  ],
});
document.getElementById('minimap').classList.add('hud');

// Tooltip + click focus + reset (shared HUD instead of the G6 tooltip plugin)
const kvFor = n => ({
  type: n.type, degree: n.degree, year: n.year, 'gross $M': n.gross_musd, 'budget $M': n.budget_musd, roi: n.roi, wins: n.wins,
  born: n.born, nationality: n.nationality, films: n.film_count, founded: n.founded, country: n.country, category: n.category,
});
const showTip = e => { const n = d.byId.get(e.target.id); if (n) hud.showTooltip(tooltipHtml(n.label, kvFor(n)), e.client.x, e.client.y); };
graph.on('node:pointerenter', showTip);
graph.on('node:pointermove', showTip);
graph.on('node:pointerleave', () => hud.hideTooltip());
graph.on('node:click', async e => {
  const id = e.target.id, n = d.byId.get(id);
  if (n?.type === 'studio') focusStudio = id;
  if (state.radial && n?.type === 'studio') await graph.layout(radialLayout(id));
  await graph.focusElement(id, { duration: 600, easing: 'ease-in-out' });
  if (graph.getZoom() < 1.6) await graph.zoomTo(1.6, { duration: 600 }, graph.getViewportCenter?.() ?? undefined);
});
graph.on('canvas:dblclick', async () => {
  graph.setElementState(Object.fromEntries([...data.nodes, ...data.edges].map(el => [el.id, []])), false);
  await graph.fitView({ when: 'always' }, { duration: 700, easing: 'ease-in-out' });
});
graph.on('canvas:pointerdown', () => hud.hideTooltip());

// test hooks (exposed before render so a harness can wait on `ready`)
window.__demo = { graph, get graph3d() { return graph3d; }, state, ready: false,
  nodeScreenPos: id => { const p = graph.getElementPosition(id); const v = graph.getCanvas().getClientByCanvas([p[0], p[1]]); return Array.isArray(v) ? { x: v[0], y: v[1] } : { x: v.x, y: v.y }; },
  hoverState: () => ({ active: graph.getElementDataByState('node', 'active').length, inactive: graph.getElementDataByState('node', 'inactive').length }),
  clickState: () => ({ selected: graph.getElementDataByState('node', 'selected').map(n => n.id), zoom: +graph.getZoom().toFixed(2) }),
  resetState: () => ({ selected: graph.getElementDataByState('node', 'selected').length, inactive: graph.getElementDataByState('node', 'inactive').length, zoom: +graph.getZoom().toFixed(2) }),
  toggleState: () => ({ plugins: graph.getPlugins().map(p => p.type), layout: graph.getLayout().type, three: !!graph3d, canvases3d: document.querySelectorAll('#app3d canvas').length, bubbles: document.querySelectorAll('#app canvas').length }),
};

await graph.render();
await graph.fitView({ when: 'always' });
graph.setPlugins(plugins());
window.__demo.ready = true;

// ---- 3D mode (lazy-loads @antv/g6-extension-3d; dropped silently if the UMD pair misbehaves) -----
const loadScript = src => new Promise((ok, err) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = err; document.head.appendChild(s); });
async function toggle3D(on) {
  state.three = on;
  const app = document.getElementById('app'), app3d = document.getElementById('app3d');
  if (!on) { app3d.hidden = true; app.style.display = ''; document.getElementById('minimap').style.display = ''; graph3d?.destroy(); graph3d = null; return; }
  try {
    if (!window.G6Extension3D) await loadScript(URL_3D);
    const X = window.G6Extension3D;
    register(ExtensionCategory.NODE, 'sphere', X.Sphere);
    register(ExtensionCategory.EDGE, 'line3d', X.Line3D);
    register(ExtensionCategory.PLUGIN, '3d-light', X.Light);
    register(ExtensionCategory.BEHAVIOR, 'observe-canvas-3d', X.ObserveCanvas3D);
    register(ExtensionCategory.BEHAVIOR, 'zoom-canvas-3d', X.ZoomCanvas3D);
    app3d.hidden = false; app.style.display = 'none'; document.getElementById('minimap').style.display = 'none';
    graph3d = new Graph({
      container: 'app3d', renderer: X.renderer, autoResize: true, background: '#0f1117', animation: false,
      data: { nodes: data.nodes.map(n => ({ id: n.id, data: n.data })), edges: data.edges.map(e => ({ id: e.id, source: e.source, target: e.target, data: e.data })) },
      node: { type: 'sphere', style: { materialType: 'phong', size: n => diameter(n.data) * 0.9, fill: n => TYPE_COLORS[n.data.type],
        labelText: n => isHub(n.data) ? n.data.label : '', labelFill: '#e8eaf2', labelFontSize: 11 } },
      edge: { type: 'line3d', style: { stroke: e => linkColor(e.data), lineWidth: e => isGold(e.data) ? 2 : 1, strokeOpacity: 0.6 } },
      layout: { type: 'd3-force-3d', link: { distance: e => DIST[E(e).relation] || 70 }, manyBody: { strength: -80 }, collide: { radius: n => diameter(N(n)) / 2 + 6 } },
      behaviors: ['observe-canvas-3d', 'zoom-canvas-3d'],
      plugins: [{ type: 'camera-setting', projectionMode: 'perspective', fov: 45, near: 0.1, far: 20000 }, { type: '3d-light', directional: { direction: [0.2, -0.4, 1], intensity: 0.9 }, ambient: { intensity: 0.45 } }],
    });
    graph3d.on('node:pointerenter', showTip); graph3d.on('node:pointermove', showTip); graph3d.on('node:pointerleave', () => hud.hideTooltip());
    await graph3d.render();
    await graph3d.fitView({ when: 'always' });
  } catch (err) {
    console.warn('3D mode unavailable:', err);
    toggle3D(false); hud.setToggle('three', false);
  }
}

</script>
</body>
</html>
